# Spark Declarative (DLT) pipeline — Bronze -> Silver.
# The notebook reads catalog/schema from the pipeline `configuration` block.
resources:
  pipelines:
    fna_dlt_pipeline:
      name: "cfo-fna-control-tower-dlt-${bundle.target}"
      catalog: ${var.catalog}
      target: ${var.schema}
      serverless: true
      channel: CURRENT
      photon: true
      configuration:
        catalog: ${var.catalog}
        schema: ${var.schema}
      libraries:
        - notebook:
            path: ../notebooks/01_DLT_Pipeline.py

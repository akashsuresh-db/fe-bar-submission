# Setup / build job. Idempotent: every run clears the raw landing volumes, re-lands deterministic data and
# rebuilds the pipeline with a full refresh. Notebook tasks run on serverless compute and receive
# catalog/schema as parameters. Each notebook ends with dbutils.notebook.exit(<json>) so the run output is
# readable text evidence.
#
#   reset_landing -> generate_data -> generate_pdf_invoices -> governance_pre -> run_pipeline (full refresh)
#        run_pipeline -> governance_post
#        run_pipeline -> ai_extraction_eval -> genie_space
#        run_pipeline -> lakebase_sync
resources:
  jobs:
    fna_setup_job:
      name: "cfo-fna-control-tower-setup-${bundle.target}"
      max_concurrent_runs: 1
      tasks:
        - task_key: reset_landing
          notebook_task:
            notebook_path: ../notebooks/00a_Reset_Schema.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: generate_data
          depends_on:
            - task_key: reset_landing
          notebook_task:
            notebook_path: ../notebooks/00_Setup_and_Data_Generation.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: generate_pdf_invoices
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../notebooks/01a_Generate_PDF_Invoices.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: governance_pre
          depends_on:
            - task_key: generate_pdf_invoices
          notebook_task:
            notebook_path: ../notebooks/00d_Governance.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              phase: pre

        - task_key: run_pipeline
          depends_on:
            - task_key: governance_pre
          pipeline_task:
            pipeline_id: ${resources.pipelines.fna_dlt_pipeline.id}
            full_refresh: true

        - task_key: governance_post
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../notebooks/00d_Governance.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              phase: post

        - task_key: ai_extraction_eval
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../notebooks/09_AI_Extraction_Evaluation.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: lakebase_sync
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../notebooks/10_Lakebase_Sync.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              instance_name: ${resources.database_instances.fna_lakebase.name}
              database_name: ${var.lakebase_database}
              mode: all

        - task_key: genie_space
          depends_on:
            - task_key: ai_extraction_eval
            - task_key: governance_post
          notebook_task:
            notebook_path: ../notebooks/06_Genie_Space.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}

    # Copies the app's Lakebase writes (approvals, call logs, chat) into Unity Catalog. Run on demand or
    # unpause the schedule for a 30-minute cadence.
    fna_lakebase_writeback_job:
      name: "cfo-fna-control-tower-lakebase-writeback-${bundle.target}"
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: writeback
          notebook_task:
            notebook_path: ../notebooks/10_Lakebase_Sync.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              instance_name: ${resources.database_instances.fna_lakebase.name}
              database_name: ${var.lakebase_database}
              mode: writeback

    # Teardown job: drops the demo schema (and everything in it). Run this before
    # `databricks bundle destroy` to remove UC data that the bundle does not own.
    fna_teardown_job:
      name: "cfo-fna-control-tower-teardown-${bundle.target}"
      tasks:
        - task_key: drop_catalog
          notebook_task:
            notebook_path: ../setup/teardown_catalog.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

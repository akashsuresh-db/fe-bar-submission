[project]
name = "app"
version = "0.1.0"
description = "Finance & Accounting Control Tower — Databricks App backend"
requires-python = ">=3.10"
# Every dependency is pinned to an exact version (==). Keep this list in sync
# with requirements.in / requirements.txt (the app runtime uses requirements.txt).
dependencies = [
    "aiohttp==3.14.3",
    "databricks-sdk==0.143.0",
    "databricks-sql-connector==4.6.0",
    "fastapi==0.141.1",
    "openai==3.16.2",
    "psycopg2-binary==2.9.13",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "reportlab==5.0.1",
    "sse-starlette==3.4.11",
    "uvicorn[standard]==0.53.0",
]

# Databricks Asset Bundle for the Finance & Accounting Ops Control Tower demo.
#
# Deployable components covered by this bundle:
#   - Lakeflow declarative pipeline (bronze -> silver -> gold, AI extraction) .. resources/pipelines.yml
#   - Setup job (land data -> governance -> pipeline -> eval -> Lakebase -> Genie) and teardown job .. resources/jobs.yml
#   - Lakebase (managed Postgres) instance ............................... resources/lakebase.yml
#   - Databricks App (FastAPI + React) ................................... resources/apps.yml
#
# The Genie space is created by the setup job (Genie validates that its tables exist, so it cannot be
# created before the pipeline has run); setup/setup.sh passes its id back with --var genie_space_id=<id>.
#
# Quick start:
#   export DATABRICKS_HOST=https://<your-workspace>.cloud.databricks.com   # or use -p <profile>
#   databricks bundle validate -t dev
#   ./setup/setup.sh        # deploy + populate the demo
#   ./setup/teardown.sh     # remove everything this bundle created
#
# The workspace host is NOT hardcoded here: the Databricks CLI does not allow
# variable interpolation for `workspace.host`, so it is supplied at runtime via
# the DATABRICKS_HOST env var or a `-p <profile>` flag. Everything else is a variable.
bundle:
  name: cfo-fna-ops-control-tower

variables:
  catalog:
    description: Unity Catalog catalog that holds the demo data
    default: fna_control_tower_catalog
  schema:
    description: Schema within the catalog
    default: finance_and_accounting
  warehouse_id:
    description: Existing SQL warehouse ID used by the app, the Genie space and the setup job
  lakebase_instance_name:
    description: Lakebase (managed Postgres) instance created by this bundle for the app
    default: fna-control-tower-db
  lakebase_database:
    description: Postgres database used by the app (the instance default database, so the app resource can bind at first deploy)
    default: databricks_postgres
  genie_space_id:
    description: Genie space id (output of the setup job's genie_space task; set by setup/setup.sh)
    default: ""
  llm_endpoint:
    description: Foundation Model API endpoint used for summaries and the last-resort chat fallback
    default: databricks-claude-sonnet-4-5
  mas_endpoint_name:
    description: Optional Agent Bricks supervisor endpoint; when empty the app chat routes to Genie
    default: ""

include:
  - resources/*.yml

targets:
  # Dev is the only target today; a prod target is added at promotion time.
  # Host comes from DATABRICKS_HOST / the active CLI profile (see header note).
  dev:
    mode: development
    default: true
